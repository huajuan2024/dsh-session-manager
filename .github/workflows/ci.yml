name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (host + client bundles)
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Verify build artifacts
        run: |
          test -f lib/index.js
          test -f lib/index.d.ts
          test -f lib/client.js
          test -f cordis.patch.yml
